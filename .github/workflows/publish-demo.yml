name: Publish demo
# Manual only: it spends API credit (about $4–6 per run with claude-opus-5-5). Runs the live
# evaluation (L3) with the ANTHROPIC_API_KEY Actions secret, renders the answer snapshot and
# deploys it to GitHub Pages. Nothing is committed: the page exists only as the Pages deployment.
# A guardrail failure (E16–E20) or a missing key fails the run, and nothing is deployed.
on:
  workflow_dispatch:
    inputs:
      max-run-tokens:
        description: Token ceiling for the whole run
        required: true
        default: "3000000"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: biomix
          POSTGRES_PASSWORD: biomix
          POSTGRES_DB: biomix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biomix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://biomix:biomix@localhost:5432/biomix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:env
      - run: npm run data:load
      - run: npm run db:reader
      # L3: the live model answers E01–E20, graded deterministically; exits 1 if a guardrail fails.
      - name: Live evaluation (L3)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_RUN_TOKENS: ${{ inputs.max-run-tokens }}
        run: npm run eval:live -- --max-run-tokens "$MAX_RUN_TOKENS"
      # The full report (per-case checks, tokens, cost, transcripts), kept with the run for review.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l3-report
          path: .cache/runs/l3-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Render the snapshot
        run: |
          npm run web:snapshot -- --from "$(ls .cache/runs/l3-*.json)" --code-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          mkdir _site
          cp .cache/web/biomix-copilot-snapshot.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
